name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore SystemCleaner.sln

      - name: Verify formatting
        run: dotnet format SystemCleaner.sln --verify-no-changes

      - name: Build
        run: dotnet build SystemCleaner.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SystemCleaner.sln --configuration Release --no-build --verbosity normal --collect "XPlat Code Coverage"

      - name: Check for vulnerable packages
        run: dotnet list SystemCleaner.sln package --vulnerable

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            **/TestResults/**/*.xml
